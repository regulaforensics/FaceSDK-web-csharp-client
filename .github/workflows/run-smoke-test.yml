name: run smoke test

on:
  pull_request:
    branches:
      - develop
      - master
      - stable

jobs:
  run_smoke_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
      - name: Build
        run: |
          dotnet build src/Regula.FaceSDK.NetCoreExample -c Release

      - name: Run basic sample
        run: ./Regula.FaceSDK.NetCoreExample
        working-directory: src/Regula.FaceSDK.NetCoreExample/bin/Release/net8.0/  