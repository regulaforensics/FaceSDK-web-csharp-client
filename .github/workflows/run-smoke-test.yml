name: run smoke test

on:
  pull_request:
    branches:
      - develop
      - master
      - stable

jobs:
  run_smoke_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3
        with:
          dotnet-version: |
            8.0.x
      - name: Build
        run: |
          dotnet build src/Regula.FaceSDK.NetCoreExample -c Release

      - name: Run basic sample
        run: ./Regula.FaceSDK.NetCoreExample
        working-directory: src/Regula.FaceSDK.NetCoreExample/bin/Release/net8.0/  