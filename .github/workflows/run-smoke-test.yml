name: run smoke test

on:
  pull_request:
    branches:
      - develop
      - master
      - stable

jobs:
  run_smoke_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            8.0.x
      - name: Build
        run: |
          dotnet build src/Regula.FaceSDK.NetCoreExample -c Release

      - name: Run basic sample
        env:
          API_BASE_PATH: ${{ github.base_ref == 'develop' && 'https://nightly-faceapi.regulaforensics.com' || github.base_ref == 'stable' && 'https://rc-faceapi.regulaforensics.com' || github.base_ref == 'master' && 'https://faceapi.regulaforensics.com' || 'https://nightly-faceapi.regulaforensics.com' }}
        run: ./Regula.FaceSDK.NetCoreExample
        working-directory: src/Regula.FaceSDK.NetCoreExample/bin/Release/net8.0/  