name: run smoke test

on:
  pull_request:
    branches:
      - develop
      - master
      - stable

jobs:
  run_smoke_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            8.0.x
      - name: Build
        run: |
          dotnet build src/Regula.FaceSDK.NetCoreExample -c Release

      - name: Run basic sample
        run: ./Regula.FaceSDK.NetCoreExample
        working-directory: src/Regula.FaceSDK.NetCoreExample/bin/Release/net8.0/  